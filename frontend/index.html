<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetingNote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e293b'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Apple SD Gothic Neo"', '"Segoe UI"', '"Malgun Gothic"', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .glass { @apply bg-white/70 backdrop-blur-xl border border-white/60 shadow-lg shadow-slate-900/5 dark:bg-slate-800/60 dark:border-slate-700/60 dark:shadow-black/20; }
      .field { @apply w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-3 text-base text-slate-800 placeholder-slate-400 outline-none transition focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/30 dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-100 dark:placeholder-slate-500; }
      .btn { @apply inline-flex items-center justify-center rounded-xl px-5 py-3 text-base font-semibold text-white shadow-sm transition active:scale-95 disabled:cursor-not-allowed disabled:opacity-50; }
      .label { @apply mb-1 block text-sm font-medium text-slate-500 dark:text-slate-400; }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-gradient-to-br from-slate-100 to-slate-200 font-sans text-slate-800 antialiased dark:from-slate-900 dark:to-slate-950 dark:text-slate-100">

  <!-- 상단 고정 헤더: 제목 + 탭 3개 + 테마 버튼 -->
  <header class="sticky top-0 z-30 border-b border-white/60 bg-white/70 backdrop-blur-xl dark:border-slate-700/60 dark:bg-slate-900/70">
    <div class="mx-auto flex h-14 max-w-6xl items-center gap-2 px-4">
      <span class="shrink-0 text-base font-bold tracking-tight sm:text-lg">MeetingNote</span>
      <span class="hidden text-sm text-slate-400 sm:inline">회의록 자동 정리</span>
      <nav class="ml-auto flex shrink-0 items-center gap-0.5 sm:gap-1" aria-label="화면 이동">
        <button type="button" data-nav="list" class="whitespace-nowrap rounded-lg px-2.5 py-1.5 text-sm font-medium sm:px-3">목록</button>
        <button type="button" data-nav="new" class="whitespace-nowrap rounded-lg px-2.5 py-1.5 text-sm font-medium sm:px-3">넣기</button>
        <button type="button" data-nav="todos" class="whitespace-nowrap rounded-lg px-2.5 py-1.5 text-sm font-medium sm:px-3">할 일</button>
        <button type="button" data-role="themeToggle" aria-label="라이트/다크 전환" title="라이트/다크 전환"
                class="ml-1 rounded-lg px-2.5 py-1.5 text-lg leading-none hover:bg-slate-200/70 dark:hover:bg-slate-700/70">◐</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">

    <!-- 화면 1: 목록 -->
    <section data-view="list" class="hidden">
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-[1fr_10rem_10rem]">
        <input id="q" type="search" class="field col-span-2 sm:col-span-1" placeholder="제목 또는 참석자로 검색" aria-label="제목 또는 참석자로 검색">
        <input id="from" type="date" class="field" aria-label="시작 날짜">
        <input id="to" type="date" class="field" aria-label="끝 날짜">
      </div>
      <p data-role="listStatus" class="mt-4 text-sm text-slate-500 dark:text-slate-400" aria-live="polite"></p>
      <div id="cards" class="mt-3 grid grid-cols-1 gap-4 md:grid-cols-2"></div>
    </section>

    <!-- 화면 2: 넣기 -->
    <section data-view="new" class="hidden">
      <div class="glass rounded-3xl p-5 sm:p-6">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div class="md:col-span-2">
            <label class="label" for="title">제목</label>
            <input id="title" type="text" maxlength="200" class="field" placeholder="제목">
          </div>
          <div>
            <label class="label" for="metAt">일시 (로컬 시각)</label>
            <input id="metAt" type="datetime-local" class="field">
          </div>
          <div>
            <label class="label" for="attendees">참석자 (쉼표로 구분)</label>
            <input id="attendees" type="text" class="field" placeholder="김민수, 이영희">
          </div>
          <div>
            <label class="label" for="file">녹취 파일 (mp3 · wav, 25MB 이하)</label>
            <input id="file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" class="field file:mr-3 file:rounded-lg file:border-0 file:bg-slate-200 file:px-3 file:py-1 file:text-sm dark:file:bg-slate-700">
          </div>
          <div class="flex flex-wrap items-center gap-3 md:self-end">
            <button id="btnUp" type="button" class="btn bg-cyan-600 hover:bg-cyan-700">받아쓰기</button>
            <span data-role="upStatus" class="text-sm text-slate-500 dark:text-slate-400" aria-live="polite"></span>
          </div>
          <div class="md:col-span-2">
            <label class="label" for="body">본문 - 받아쓴 원문 또는 붙여넣은 메모</label>
            <textarea id="body" rows="8" class="field resize-y" placeholder="녹취를 받아쓰거나 메모를 붙여 넣으세요"></textarea>
          </div>
        </div>
        <div class="mt-5 flex flex-wrap items-center gap-3">
          <button id="btnSave" type="button" class="btn bg-slate-800 hover:bg-slate-900 dark:bg-slate-600 dark:hover:bg-slate-500">정리하기</button>
          <span data-role="saveStatus" class="text-sm text-slate-500 dark:text-slate-400" aria-live="polite"></span>
        </div>
      </div>
      <div id="result" class="mt-5 hidden"></div>
    </section>

    <!-- 화면 4: 할 일 -->
    <section data-view="todos" class="hidden">
      <p data-role="todoStatus" class="mb-3 text-sm text-slate-500 dark:text-slate-400" aria-live="polite"></p>
      <div class="glass overflow-x-auto rounded-2xl">
        <table class="w-full min-w-[34rem] text-left text-base">
          <thead class="bg-slate-800 text-white dark:bg-slate-700">
            <tr>
              <th class="px-4 py-3 font-semibold">내용</th>
              <th class="px-4 py-3 font-semibold">담당자</th>
              <th class="px-4 py-3 font-semibold">기한</th>
              <th class="px-4 py-3 font-semibold">회의</th>
            </tr>
          </thead>
          <tbody id="todoBody" class="divide-y divide-slate-200/70 dark:divide-slate-700/70"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 화면 3: 상세 (겹침 창) -->
  <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-label="회의록 상세">
    <div class="glass max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-3xl bg-white/90 p-5 shadow-2xl dark:bg-slate-800/90 sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 data-role="mHeading" class="break-words text-xl font-bold"></h2>
          <p data-role="mMeta" class="mt-1 text-sm text-slate-500 dark:text-slate-400"></p>
        </div>
        <button type="button" data-role="mClose" class="shrink-0 rounded-lg px-3 py-1.5 text-sm hover:bg-slate-200/70 dark:hover:bg-slate-700/70">닫기</button>
      </div>
      <div data-role="mParts" class="mt-4"></div>
      <details class="mt-4">
        <summary class="cursor-pointer select-none text-sm font-medium text-slate-600 dark:text-slate-300">받아쓴 본문 보기</summary>
        <p data-role="mBody" class="mt-2 whitespace-pre-wrap break-words rounded-xl bg-slate-100/80 p-3 text-sm dark:bg-slate-900/60"></p>
      </details>
      <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-[1fr_auto_auto]">
        <input id="mTitle" type="text" maxlength="200" class="field" placeholder="제목 수정" aria-label="제목 수정">
        <button type="button" data-role="mSave" class="btn bg-slate-800 hover:bg-slate-900 dark:bg-slate-600 dark:hover:bg-slate-500">제목 수정</button>
        <button type="button" data-role="mDelete" class="btn bg-rose-600 hover:bg-rose-700">삭제</button>
      </div>
      <p data-role="mStatus" class="mt-3 text-sm text-slate-500 dark:text-slate-400" aria-live="polite">삭제는 한 번 더 눌러야 지워집니다.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
